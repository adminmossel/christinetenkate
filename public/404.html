<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina niet gevonden — Christine ten Kate</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/img/logo-blocks.png" type="image/png" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-4);
      background:
        radial-gradient(900px 260px at 15% -10%, color-mix(in srgb, var(--color-accent) 12%, transparent), transparent),
        var(--color-bg);
    }
    .logo404 { font-family: var(--font-display); font-size: var(--fs-lg); color: var(--color-primary); text-decoration: none; margin-bottom: var(--space-5); }
    .logo404 span { color: var(--color-accent); }
    .code404 {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 600;
      font-size: 5.5rem;
      line-height: 1;
      color: color-mix(in srgb, var(--color-accent) 55%, transparent);
      margin: 0 0 -0.15em;
      user-select: none;
    }
    .trail404 { width: 220px; max-width: 60vw; height: auto; margin: 0 auto var(--space-3); display: block; }
    h1 { font-family: var(--font-display); font-size: var(--fs-xl); color: var(--color-primary); margin: 0 0 var(--space-2); }
    p.lead { color: var(--color-ink-soft); max-width: 46ch; margin: 0 auto var(--space-4); }
    .btn404 {
      display: inline-block;
      padding: 12px 28px;
      background: var(--color-primary);
      color: var(--color-white);
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .btn404:hover { background: var(--color-primary-dark, var(--color-primary)); transform: translateY(-2px); }
  </style>
</head>
<body>
  <a class="logo404" href="/">Christine <span>ten Kate</span></a>

  <p class="code404" aria-hidden="true">404</p>
  <svg class="trail404" viewBox="0 0 260 60" fill="none" aria-hidden="true">
    <path d="M4 46 C 40 10, 90 66, 130 30 S 210 -4, 250 26" stroke="var(--color-accent)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.5 13"/>
    <circle cx="250" cy="26" r="4.5" fill="var(--color-primary)"/>
    <circle cx="250" cy="26" r="9" stroke="var(--color-primary)" stroke-width="1.6" opacity="0.35"/>
  </svg>

  <h1>Deze pagina is zoek</h1>
  <p class="lead">Kinderen raken weleens een want kwijt, een schoen, af en toe een hele knuffel. Deze pagina blijkt hetzelfde te hebben gedaan — waarschijnlijk verplaatst, misschien nooit gemaakt.</p>
  <a class="btn404" href="/">Terug naar de homepage</a>
</body>
</html>
