<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Pagina's — Beheer</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
  <link rel="stylesheet" href="/admin/css/admin-theme.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="admin">
  <div id="admin-main-content">
    <div class="admin-header">
      <div>
        <h1>Pagina's</h1>
        <p style="color:var(--color-ink-soft);">Beheer alle pagina's van de website.</p>
      </div>
      <button class="btn-admin btn-admin--primary" id="new-page-btn">+ Nieuwe pagina</button>
    </div>

    <div class="editor-tabs">
      <button type="button" class="is-active" data-view="active">Actief</button>
      <button type="button" data-view="trash">Prullenbak</button>
    </div>

    <div class="admin-card">
      <table class="admin-table" id="pages-table">
        <thead>
          <tr><th>Titel</th><th>Status</th><th>URL</th><th>Laatst gewijzigd</th><th>Acties</th></tr>
        </thead>
        <tbody id="pages-table-body">
          <tr><td colspan="5">Pagina's worden geladen…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="/admin/js/admin-dashboard.js"></script>
</body>
</html>
